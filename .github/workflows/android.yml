name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 仓库未提交二进制 gradle-wrapper.jar，这里用已安装的 Gradle 生成 wrapper（含 jar），
      # 之后即可使用标准 ./gradlew 进行构建。
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      # 把存在 GitHub Secret 里的 keystore（base64）还原成文件，供签名使用。
      # 这样每次构建都用同一把钥匙，更新安装不会再报签名不匹配。
      - name: Decode signing keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/minimax.jks
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/minimax.jks" >> $GITHUB_ENV
          ls -la $RUNNER_TEMP/minimax.jks

      - name: Build signed release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs "$APK" | head -n 8

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: minimax-h3-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
